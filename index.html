<style>
/* Layout: coluna única de celular (máx. 760px), barra superior fixa com status de envio; editor em 4 abas que seguem a planilha. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --sunk:#E3E9E1; --ink:#14201A; --muted:#55655B; --line:#CBD5C9;

  --ok:#2B7A4B; --warn:#A86A12; --crit:#B3261E;
  --cA:#B3261E; --cB:#D9480F; --cC:#B7860B; --cD:#2B7A4B; --cE:#2F6CA8; --on-cls:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#16201B; --sunk:#1D2923; --ink:#E6EEE8; --muted:#9BAAA1; --line:#2C3A33;
  --brand:#74C69A; --on-brand:#0B1A12; --accent:#FF7B3D; --on-accent:#1A0B03;
  --ok:#6FD39A; --warn:#E8B04B; --crit:#FF8A80;
  --cA:#FF6B5E; --cB:#FF8C4A; --cC:#E8B04B; --cD:#6FD39A; --cE:#7DB4F0; --on-cls:#0B1A12; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#16201B; --sunk:#1D2923; --ink:#E6EEE8; --muted:#9BAAA1; --line:#2C3A33;
  --brand:#74C69A; --on-brand:#0B1A12; --accent:#FF7B3D; --on-accent:#1A0B03;
  --ok:#6FD39A; --warn:#E8B04B; --crit:#FF8A80;
  --cA:#FF6B5E; --cB:#FF8C4A; --cC:#E8B04B; --cD:#6FD39A; --cE:#7DB4F0; --on-cls:#0B1A12; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-brand)}

.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;gap:8px;align-items:baseline;min-width:0}

.topbar .in{flex-wrap:nowrap}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;border:1.5px solid color-mix(in srgb,var(--on-brand) 45%,transparent);border-radius:999px;padding:5px 10px;font-size:13px;background:transparent;color:var(--on-brand)}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--on-brand);opacity:.7}

.sync.off .dot{background:var(--warn);opacity:1}
.back{background:transparent;border:0;color:var(--on-brand);font-size:15px;padding:4px 6px 4px 0;display:flex;align-items:center;gap:4px}

h2{font-size:24px} h3{font-size:19px}

@media (max-width:460px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.search{flex:1 1 220px;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 11px}

input:disabled,select:disabled,textarea:disabled{opacity:.65}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-block:10px}

.list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}

.cls.A{background:var(--cA)} .cls.B{background:var(--cB)} .cls.C{background:var(--cC)} .cls.D{background:var(--cD)} .cls.E{background:var(--cE)}
.cls.none{background:var(--sunk);color:var(--muted);border:1.5px dashed var(--line)}
.card .t{min-width:0}

.pill{font-size:12px;border-radius:99px;padding:2px 8px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.part{border-color:var(--warn);color:var(--warn)}
.pill.pend{border-color:var(--accent);color:var(--accent)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:20px}
.empty ol{margin:10px 0 0;padding-left:20px}
.empty li{margin-block:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-block:12px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:15;background:var(--bg);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-block:8px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 4px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab small{font-weight:400;font-size:11px}
.tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.ahead{display:flex;gap:12px;align-items:center;margin-block:12px}
.ahead .t{min-width:0}
.ahead h2{overflow-wrap:anywhere}
.saved{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:14px;font-weight:700}
.field .hint{font-size:12px;color:var(--muted)}
.req::after{content:" *";color:var(--accent)}
.fs{display:flex;flex-direction:column;gap:12px}
.crit{padding-block:14px;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:0}
.crit .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{min-height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;font-family:var(--f-display);font-weight:700;font-size:22px}
.scale button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.scale.sm button{min-height:40px;font-size:18px}
.rule{font-size:14px;color:var(--muted);margin-top:8px;min-height:2.8em}
.rule b{color:var(--ink)}
.risks{display:flex;flex-direction:column;gap:10px}
.risk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px);gap:10px;align-items:center}
.risk .nm{font-size:14px}
.risk .nm small{display:block;color:var(--muted);font-size:12px}
@media (max-width:520px){.risk{grid-template-columns:1fr}}
.preview{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--sunk);border-radius:var(--r);padding:12px;margin-block:12px}
.preview .nums{font-size:14px}
.preview .nums b{font-variant-numeric:tabular-nums}
.kv{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pts{display:flex;flex-direction:column;gap:10px}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px}
.pt h3{display:flex;gap:8px;align-items:center}
.pt .ph{width:112px;height:112px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;font-size:12px;color:var(--muted);text-align:center;border:1.5px dashed var(--line)}
.pt .ph img{width:100%;height:100%;object-fit:cover}
.pt .flds{display:flex;flex-direction:column;gap:8px;min-width:0}
.pt .act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:420px){.pt{grid-template-columns:1fr}.pt .ph{width:100%;height:180px}}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:8px;padding:8px 10px;overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.confirm{border:1.5px solid var(--crit);border-radius:var(--r);padding:12px;background:var(--surface);margin-top:10px}
details summary{cursor:pointer;font-weight:700}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.card,.scale button{transition:background-color .12s,border-color .12s}}
</style>

<script>
(() => {
"use strict";
// ---------- Parâmetros (iguais à aba PARAMETROS da planilha) ----------
const TIPOS = ["Prédio administrativo","Margem de via","Circulação de pessoas","Circulação de veículos","Entorno de estruturas/instalações","Muro","Cerca perimetral","Área de acesso","Drenagem","Talude","Paisagismo/conservação","Segurança patrimonial","Outras"];
const VEG = {"Gramínea (gramado)":2,"Capim":5,"Vegetação rasteira":2,"Vegetação arbustiva":3,"Vegetação invasora":4,"Bambuzal":4,"Rebrotas":4,"Vegetação de alta densidade":5,"Vegetação mista":3,"Outros":3};
const TERRENOS = ["Plano","Ondulado","Talude / declive acentuado","Com muitos obstáculos"];
const METODOS = ["Roçadeira costal/lateral","Mecanizada (giro zero/trator)","Manual (foice/facão)","Mista (mecanizada + acabamento)"];
const SITUACOES = ["Ativa","Em validação","Inativa","Inacessível"];
const PERIODOS = ["Chuvoso","Transição","Seco"];
const DIRS = ["N","NE","L","SE","S","SO","O","NO"];
const CYC = {A:[15,15,20],B:[15,20,30],C:[20,30,45],D:[30,45,60],E:[60,60,90]};
const W = {cresc:.25,crit:.20,risco:.15,veg:.15,hist:.10,clima:.10,cond:.05};
const CRITS = [
  {k:"cresc", nome:"Velocidade de crescimento", niveis:[
    "Muito baixa: menos de 1 cm/semana; mais de 60 dias até ficar Ruim no período chuvoso.",
    "Baixa: 1 a 3 cm/semana; 46 a 60 dias até Ruim.",
    "Média: 3 a 6 cm/semana; 31 a 45 dias até Ruim.",
    "Alta: 6 a 10 cm/semana; 21 a 30 dias até Ruim.",
    "Muito alta: mais de 10 cm/semana; até 20 dias até Ruim (capim no pico das chuvas)."]},
  {k:"crit", nome:"Criticidade operacional", niveis:[
    "Área isolada: sem circulação, sem estrutura ou equipamento a menos de 10 m, sem drenagem nem função de segurança.",
    "Circulação eventual (menos de 1 vez por semana); estruturas a mais de 10 m; impacto só estético.",
    "Circulação diária de pessoas, estrutura a até 10 m ou paisagismo de prédio; afeta conforto e imagem.",
    "Via ou acesso com tráfego diário, entorno de instalação, drenagem ativa ou cerca perimetral.",
    "Risco direto: interseções e curvas, rota de emergência, faixa de CFTV/ronda, subestação, tanques, exigência legal."]},
  {k:"clima", nome:"Sensibilidade climática", niveis:[
    "Ritmo igual o ano todo (solo raso ou seco, sombreado).",
    "Variação pequena (chuvoso cerca de 1,2× o seco).",
    "Variação moderada (chuvoso cerca de 1,5× o seco).",
    "Alta: baixada, solo úmido, margem de drenagem (chuvoso 2× ou mais).",
    "Muito alta: área irrigada, encharcada ou que recebe escoamento (3× ou mais)."]},
  {k:"cond", nome:"Condição atual", niveis:[
    "Excelente: até 10 cm, uniforme, bordas acabadas, sem resíduos.",
    "Boa: 10 a 20 cm; manchas isoladas em menos de 10% da área.",
    "Regular: 20 a 30 cm ou 10 a 25% acima do padrão; começa a invadir meio-fio e cerca.",
    "Ruim: 30 a 50 cm ou mais de 25% acima; vegetação em cercas e drenagens.",
    "Crítica: mais de 50 cm; obstrução de visibilidade, sinalização ou drenagem; material seco; animais."]}
];
const RISKS = [
  {k:"seg", nome:"Segurança de pessoas", a5:"oculta buracos, tocos ou animais em rota de pedestres"},
  {k:"vis", nome:"Visibilidade", a5:"bloqueia visada em cruzamento, curva ou sinalização"},
  {k:"circ", nome:"Circulação", a5:"invade faixa de rolamento ou passeio"},
  {k:"dren", nome:"Drenagem", a5:"obstrui canaleta ou bueiro que protege instalação ou via"},
  {k:"aces", nome:"Acesso", a5:"impede acesso de manutenção ou emergência"},
  {k:"pat", nome:"Segurança patrimonial", a5:"ponto cego no CFTV ou esconde intrusos na cerca"},
  {k:"estr", nome:"Proximidade de estruturas", a5:"encosta em subestação, tanque, painel ou tubovia"},
  {k:"inc", nome:"Propagação de incêndio", a5:"biomassa seca contínua até uma instalação"},
  {k:"oper", nome:"Interferência operacional", a5:"impede operação ou inspeção obrigatória"}
];
const RISK_SCALE = ["Inexistente","Baixo","Moderado","Alto","Muito alto"];

// ---------- Utilitários ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { if (v === null || v === undefined || v === "") return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmtN = (v, d=0) => v == null ? "–" : Number(v).toLocaleString("pt-BR", {maximumFractionDigits:d, minimumFractionDigits:d});
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const brDate = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "";
const getPath = (o, p) => p.split(".").reduce((a, k) => a == null ? undefined : a[k], o);
function setPath(o, p, v){ const ks = p.split("."); let a = o; for (let i = 0; i < ks.length-1; i++){ if (a[ks[i]] == null || typeof a[ks[i]] !== "object") a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length-1]] = v; }
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
let toastT;
function toast(msg, ms=3200){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }
function parseCoord(s){
  if (!s) return null;
  const m = String(s).replace(/[()]/g," ").match(/(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)/);
  if (!m) return null;
  const lat = num(m[1]), lon = num(m[2]);
  if (lat == null || lon == null || Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return {lat, lon};
}
const coordStr = (lat, lon) => (lat != null && lon != null) ? `${lat.toFixed(6)}, ${lon.toFixed(6)}` : "";

// ---------- Cálculos (mesmas regras da planilha) ----------
function riskScore(d){
  const v = RISKS.map(r => d?.riscos?.[r.k]).filter(x => x >= 1);
  if (!v.length) return null;
  return Math.round(0.5*Math.max(...v) + 0.5*v.reduce((a,b)=>a+b,0)/v.length);
}
function histScore(h){
  h = h || {};
  const occKeys = ["retrab","reinc","reclam","nc"];
  const has = num(h.rocadas12) != null || occKeys.some(k => num(h[k]) != null) || num(h.diasRuim) != null;
  if (!has) return {s:3, neutro:true};
  const n = occKeys.reduce((a,k) => a + (num(h[k]) || 0), 0);
  const so = n === 0 ? 1 : n === 1 ? 2 : n === 2 ? 3 : n <= 4 ? 4 : 5;
  const dr = num(h.diasRuim);
  const sd = dr == null ? 1 : dr <= 15 ? 5 : dr <= 25 ? 4 : dr <= 40 ? 3 : dr <= 60 ? 2 : 1;
  return {s: Math.max(so, sd), neutro:false, ocorr:n};
}
function calc(r){
  const d = r.diag || {};
  const risco = riskScore(d);
  const veg = VEG[r.vegetacao] ?? null;
  const hs = histScore(r.hist);
  const miss = [];
  CRITS.forEach(c => { if (!(d[c.k] >= 1)) miss.push(c.nome.toLowerCase()); });
  if (risco == null) miss.push("risco");
  if (veg == null) miss.push("tipo de vegetação");
  if (miss.length) return {ok:false, miss, risco, hs};
  const pf = d.cresc*W.cresc + d.crit*W.crit + risco*W.risco + veg*W.veg + hs.s*W.hist + d.clima*W.clima + d.cond*W.cond;
  const idx = Math.round((pf-1)/4*1000)/10;

// GPS gravado na foto (EXIF), quando o celular inclui
function exifGps(buf){
  try {
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o < v.byteLength - 4){
      const m = v.getUint16(o);
      if (m === 0xFFE1){
        const len = v.getUint16(o+2);
        if (v.getUint32(o+4) === 0x45786966){
          const t = o + 10, le = v.getUint16(t) === 0x4949;
          const g16 = p => v.getUint16(p, le), g32 = p => v.getUint32(p, le);
          const ifd0 = t + g32(t+4), n0 = g16(ifd0);
          let gps = 0;
          for (let i = 0; i < n0; i++){ const e = ifd0 + 2 + i*12; if (g16(e) === 0x8825) gps = g32(e+8); }
          if (!gps) return null;
          const gi = t + gps, gn = g16(gi);
          const dms = off => { let s = 0; for (let k = 0; k < 3; k++){ const a = g32(t+off+k*8), b = g32(t+off+k*8+4); s += (b ? a/b : 0) / Math.pow(60, k); } return s; };
          let lat = null, lon = null, latR = "N", lonR = "E";
          for (let i = 0; i < gn; i++){
            const e = gi + 2 + i*12, tag = g16(e);
            if (tag === 1) latR = String.fromCharCode(v.getUint8(e+8));
            if (tag === 3) lonR = String.fromCharCode(v.getUint8(e+8));
            if (tag === 2) lat = dms(g32(e+8));
            if (tag === 4) lon = dms(g32(e+8));
          }
          if (lat == null || lon == null || !isFinite(lat) || !isFinite(lon) || (lat === 0 && lon === 0)) return null;
          return {lat: latR === "S" ? -lat : lat, lon: lonR === "W" ? -lon : lon};
        }
        o += 2 + len;
      } else if ((m & 0xFF00) === 0xFF00){ o += 2 + v.getUint16(o+2); } else break;
    }
  } catch {}
  return null;
}
async function prepPhoto(file, stamp){
  let src, w0, h0;
  try { src = await createImageBitmap(file, {imageOrientation:"from-image"}); w0 = src.width; h0 = src.height; }
  catch {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
    w0 = src.naturalWidth; h0 = src.naturalHeight;
  }
  const s = Math.min(1, 1600/Math.max(w0, h0));
  const w = Math.round(w0*s), h = Math.round(h0*s);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  x.drawImage(src, 0, 0, w, h);
  const fs = Math.max(14, Math.round(w/48));
  x.fillStyle = "rgba(0,0,0,0.62)"; x.fillRect(0, h - fs*2.3, w, fs*2.3);
  x.fillStyle = "#ffffff"; x.font = `700 ${fs}px Arial, sans-serif`; x.textBaseline = "middle";
  x.fillText(stamp, fs*0.6, h - fs*1.15, w - fs*1.2);
  return await new Promise(res => c.toBlob(res, "image/jpeg", 0.76));
}

function cardHTML(r){
  const c = calc(r), cm = cadMiss(r), ds = diagState(r), f = fotoState(r);
  const fok = f.N != null && f.done >= f.N;
  const cls = c.ok ? `<div class="cls ${c.cls}" aria-label="Classe ${c.cls}">${c.cls}</div>` : `<div class="cls none" aria-label="Sem classe">?</div>`;
  const pills = [
    `<span class="pill ${cm.length ? (cm.length < 9 ? "part" : "") : "ok"}">Cadastro</span>`,
    `<span class="pill ${ds === "ok" ? "ok" : ds === "part" ? "part" : ""}">Diagnóstico</span>`,
    `<span class="pill ${fok ? "ok" : f.done ? "part" : ""}">Fotos ${f.done}/${f.N ?? "?"}</span>`,
    pending[r.id] ? (dbState === "local" ? `<span class="pill pend">editada</span>` : `<span class="pill pend">a enviar</span>`) : ""
  ].join("");

}

function openArea(id){
  ui.view = "area"; ui.id = id; if (!ui.tab) ui.tab = "cad";
  const r = getRec(id); draft = r ? clone(r) : null; delete draft?._v;
  confirmDel = false; remoteNewer = false;
  saveUI(); renderTop(); renderArea(); window.scrollTo(0, 0);
}
function goHome(){
  commitNow();
  ui.view = "lista"; ui.id = null; draft = null; saveUI(); renderTop(); renderList(); window.scrollTo(0, 0);
}
function commitNow(){ if (saveT){ clearTimeout(saveT); saveT = null; if (draft) queue(draft); } }
function touch(){
  if (!draft) return;
  draft.meta = draft.meta || {};
  draft.meta.atualizado = new Date().toISOString(); draft.meta.por = myId;
  const s = $("#savedmsg"); if (s) s.textContent = "Salvando…";
  clearTimeout(saveT);
  saveT = setTimeout(() => { saveT = null; queue(draft); const s2 = $("#savedmsg"); if (s2) s2.textContent = "Salvo no aparelho"; updateHead(); }, 900);
}
function selectHTML(id, path, opts, val, req){
  const list = opts.slice(); if (val && !list.includes(val)) list.push(val);
  return `<select id="${id}" data-f="${path}" ${req ? "required" : ""}><option value="">Selecione…</option>${list.map(o => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}
const inp = (id, path, val, type="text", extra="") => `<input type="${type}" id="${id}" data-f="${path}" value="${esc(val ?? "")}" ${extra}>`;
function headHTML(){
  const r = draft, c = calc(r), cm = cadMiss(r), f = fotoState(r);
  const cls = c.ok ? `<div class="cls ${c.cls}">${c.cls}</div>` : `<div class="cls none">?</div>`;
  return `${cls}<div class="t"><h2>${esc(r.nome || "Área sem nome")}</h2><div class="saved"><span id="savedmsg">${pending[r.id] ? "Salvo no aparelho" : (dbState === "local" ? "Sem alterações" : "Enviado")}</span>${r.meta?.atualizado ? " · atualizado " + esc(new Date(r.meta.atualizado).toLocaleString("pt-BR", {dateStyle:"short", timeStyle:"short"})) : ""}<span id="byname"></span></div></div>`;
}
function updateHead(){
  const h = $("#ahead"); if (h) h.innerHTML = headHTML();
  resolveBy();
  const pv = $("#preview"); if (pv) pv.innerHTML = previewHTML();
  const tabs = $("#tabs"); if (tabs) tabs.innerHTML = tabsHTML();
}
async function resolveBy(){
  const id = draft?.meta?.por; const el = $("#byname");
  if (el && id && SUPA){ el.textContent = " por " + id; return; }
  if (!el || !id || !user) return;
  try { const ps = await user.profiles([id]); const nm = ps[id]?.name; if (nm && $("#byname")) $("#byname").textContent = " por " + nm; } catch {}
}
function tabsHTML(){
  const r = draft, cm = cadMiss(r), ds = diagState(r), f = fotoState(r);
  const t = [
    ["cad","Cadastro", cm.length ? `faltam ${cm.length}` : "completo"],
    ["diag","Diagnóstico", ds === "ok" ? "completo" : ds === "part" ? "em andamento" : "a fazer"],
    ["hist","Histórico", histScore(r.hist).neutro ? "opcional" : "informado"],
    ["evid","Evidências", `${f.done}/${f.N ?? "?"} pontos`]
  ];
  return t.map(([k,l,s]) => `<button class="tab" role="tab" data-act="tab" data-v="${k}" aria-selected="${ui.tab === k}">${l}<small>${s}</small></button>`).join("");
}
function previewHTML(){
  const c = calc(draft), e = evid(draft);
  if (!c.ok) return `<div class="cls none">?</div><div class="nums">Prévia da classe: falta ${esc(c.miss.join(", "))}.${c.risco != null ? ` Risco calculado: <b>${c.risco}</b>.` : ""}</div>`;
  const regra = c.regra === "piso" ? " · elevada a B pela regra de piso" : c.regra === "teto" ? " · limitada a D pela regra de teto" : "";
  return `<div class="cls ${c.cls}">${c.cls}</div><div class="nums"><div class="kv"><span>Índice <b>${fmtN(c.idx,1)}</b></span><span>Risco <b>${c.risco}</b></span><span>Histórico <b>${c.hs.s}</b>${c.hs.neutro ? " (neutro)" : ""}</span></div>
    <div>Ciclos chuvoso / base / seco: <b>${c.cyc.join(" / ")} dias</b>${esc(regra)}</div>${e ? `<div>Evidência: <b>${e.N} pontos</b>, ${e.fotos} fotos por OM${e.pano ? ", com panorâmica" : ""}</div>` : ""}</div>`;
}
function renderArea(){
  const app = $("#app");
  if (!draft){ app.innerHTML = `<div class="empty">Esta área não existe mais. <button class="btn sm" data-act="home">Voltar à lista</button></div>`; return; }
  let h = "";
  if (readOnly) h += `<div class="banner">Acesso só de leitura: o que você preencher fica neste aparelho.</div>`;
  if (remoteNewer) h += `<div class="banner info">Outra pessoa atualizou esta área. <button class="btn sm" data-act="reload">Ver a versão mais recente</button></div>`;
  h += `<div class="ahead" id="ahead">${headHTML()}</div>`;

const loaded = {};
function loadScript(src){
  if (loaded[src]) return loaded[src];
  loaded[src] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error("load")); }; document.head.appendChild(s); });

}

async function saveFile(filename, data){

    if (hi < 0){ toast("Não encontrei a coluna de ID da área no arquivo."); return; }
    const head = rows[hi].map(norm), col = {};
    head.forEach((h, i) => { if (!h) return; for (const [k, re] of MAP){ if (col[k] == null && re.test(h)){ col[k] = i; break; } } });
    let novas = 0, existentes = 0, invalidas = 0, exemplos = 0;
    const lista = [];
    for (const row of rows.slice(hi + 1)){
      let id = String(row[col.id] ?? "").trim().toUpperCase().replace(/\s+/g, "-");
      if (!id) continue;
      if (!/^[A-Z0-9_.~:@+\-]+$/.test(id)){ invalidas++; continue; }
      if (sh === wb.Sheets["BASE_AREAS"] && /^EX-\d{3}$/.test(id)){ exemplos++; continue; }
      if (getRec(id)){ existentes++; continue; }
      const r = blankRec(id, "");
      const g = k => col[k] == null ? "" : row[col[k]];
      ["sap","nome","descricao","localizacao","setor","geometria","tipo_area","vegetacao","terreno","metodo","sazonalidade","situacao","obs"].forEach(k => { const v = g(k); if (v !== "" && v != null) r[k] = String(v).trim(); });
      ["area_m2","extensao_m","interfaces","periodicidade_atual","lat","lon"].forEach(k => { const v = num(g(k)); if (v != null) r[k] = v; });
      if (!["Poligonal","Linear"].includes(r.geometria)) r.geometria = num(r.extensao_m) ? "Linear" : "Poligonal";
      lista.push(r);
    }
    for (const r of lista){ ver += 1; const x = clone(r); x._v = ver; pending[r.id] = x; novas++; }
    savePending(); renderList(); flush();
    toast(`${novas} área(s) importada(s)${existentes ? `, ${existentes} já existiam e ficaram como estavam` : ""}${invalidas ? `, ${invalidas} com ID inválido` : ""}${exemplos ? `, ${exemplos} linhas de exemplo (EX-###) ignoradas` : ""}.`, 6000);
  } catch {
    toast("Não consegui ler o arquivo. Use .xlsx ou .csv com uma linha de cabeçalho.");
  }
});

// ---------- Banco compartilhado ----------
function onAreas(snap){
  const next = {};
  snap.docs.forEach(d => { next[d.id] = d.data(); });
  dbState = "ok"; applyAreas(next);
}
function applyAreas(next){
  areas = next; renderSync();
  if (ui.view === "lista") { if (!document.activeElement || document.activeElement.id !== "q") renderList(); }
  else if (ui.view === "area" && draft){
    const rem = areas[ui.id];
    if (!rem && !pending[ui.id] && !saveT){ /* excluída por outra pessoa */ draft = null; renderArea(); return; }
    if (rem && !pending[ui.id] && !saveT && rem.meta?.atualizado && draft.meta?.atualizado && rem.meta.atualizado > draft.meta.atualizado && rem.meta.por !== myId){
      if (!remoteNewer){ remoteNewer = true; renderArea(); }
    } else if (rem && !pending[ui.id] && !saveT && rem.meta?.atualizado === draft.meta?.atualizado){
      const s = $("#savedmsg"); if (s) s.textContent = "Enviado";
    }
  }
}
async function boot(){
  if (SUPA){
    deleted.clear();
    sbAuth = LS.get("rocada.sb", null);
    if (sbAuth && sbAuth.codigo) myId = sbAuth.nome; else sbAuth = null;
    const c = LS.get("rocada.cache", null);
    if (sbAuth && c && c.areas){ areas = c.areas; sbLast = c.last || null; }
  }
  renderTop();
  if (ui.view === "area" && ui.id && getRec(ui.id)) openArea(ui.id); else { ui.view = "lista"; renderList(); }
  const C = window.claude;
  if (SUPA){
    if ("serviceWorker" in navigator && location.protocol === "https:"){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
    if (!sbAuth){ renderLogin(""); return; }
    await sbStart();
    setInterval(() => { if (document.visibilityState === "visible" && navigator.onLine !== false){ sbSync(); if (Object.keys(pending).length) flush(); } }, 60000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sbSync(); });
    window.addEventListener("online", () => { sbSync().then(() => flush()); });
    return;
  }
  if (STANDALONE){
    try {
      const rs = await fetch("data/areas.json", {cache: "no-cache"});
      if (rs.ok){ const lista = await rs.json(); const m = {}; lista.forEach(r => { if (r && r.id) m[r.id] = r; }); areas = m; }
    } catch {}
    renderSync();
    if (ui.view === "lista") renderList(); else if (ui.view === "area" && !draft && getRec(ui.id)) openArea(ui.id);
    if ("serviceWorker" in navigator && location.protocol === "https:"){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
    return;
  }
  const [d, u, a, dl] = await Promise.all([C.use("db"), C.use("user"), C.use("assets"), C.use("downloads")].map(p => p.catch(() => null)));
  db = d; user = u; assets = a; downloads = dl;
  if (user){ try { myId = await user.id(); } catch {} try { const w = await user.can("data.write"); if (w === false) readOnly = true; } catch {} }
  if (!db){ dbState = "none"; renderSync(); if (ui.view === "lista") renderList(); return; }
  db.collection("areas").onSnapshot(onAreas, () => { dbState = "none"; renderSync(); });
  flush();
}
boot();
})();
</script>
